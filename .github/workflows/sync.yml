name: sync

on:
  schedule:
    - cron: "0 19 * * *" # daily, ~05:00 Sydney time
  workflow_dispatch:

permissions:
  contents: write

# A hung run must not block tomorrow's scheduled run — state is saved
# incrementally and committed with `if: always()`, so cancelling is safe.
concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python -m src.main

      - name: Commit state back to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/unmatched.json
          git diff --cached --quiet || git commit -m "sync: update state"
          git push
